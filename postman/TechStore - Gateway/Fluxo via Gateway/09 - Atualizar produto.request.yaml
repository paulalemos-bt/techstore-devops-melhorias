$kind: http-request
url: "{{base_url}}/produtos/{{produto_id}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "preco": 69.90
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Preco atualizado', () => pm.expect(pm.response.json().preco).to.eql(69.9));
order: 9000
