$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Email correto', () => pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get('test_email')));
order: 4000
