worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # DNS interno do Docker: permite o gateway subir mesmo que um serviço ainda não esteja no ar
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        # Repassa o cabeçalho Authorization (token JWT) e dados do cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;

        # Saúde do próprio gateway
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # /auth/...  -> Serviço de Autenticação/Usuários
        location /auth/ {
            set $auth_upstream "auth-service:3001";
            proxy_pass http://$auth_upstream$request_uri;
        }

        # /produtos  e  /produtos/...  -> Serviço de Produtos
        location /produtos {
            set $produtos_upstream "produtos-service:3002";
            proxy_pass http://$produtos_upstream$request_uri;
        }

        # Qualquer outra rota
        location / {
            default_type application/json;
            return 404 '{"erro":"rota nao encontrada"}';
        }
    }
}
